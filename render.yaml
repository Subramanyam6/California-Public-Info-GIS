services:
  # Backend API Service
  - type: web
    name: gis-api-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GEOCODIO_API_KEY
        sync: false
      - key: DATA_DIR
        value: /app/data
    healthCheckPath: /health

  # Frontend Web Service
  # Note: Deploy backend first, then update REACT_APP_API_BASE_URL with backend URL
  - type: web
    name: gis-app-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Set this to your backend URL after backend is deployed
      # Format: https://gis-api-backend.onrender.com/api/v1
      - key: REACT_APP_API_BASE_URL
        sync: false
